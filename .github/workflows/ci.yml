name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  api:
    name: API — fmt, clippy, tests, OpenAPI
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lebontroc
          POSTGRES_PASSWORD: lebontroc
          POSTGRES_DB: lebontroc
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U lebontroc"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://lebontroc:lebontroc@localhost:5432/lebontroc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/api
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
      - name: Contrat OpenAPI synchronisé
        run: |
          cargo run --quiet --bin dump-openapi > ../../packages/api-client/openapi.json
          if ! git diff --quiet -- ../../packages/api-client/openapi.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add ../../packages/api-client/openapi.json
            git commit -m "chore: resynchronise openapi.json depuis le code Rust [skip ci]"
            git push
            echo "::error::Contrat OpenAPI divergent — la version régénérée vient d'être committée. Re-lancer la CI."
            exit 1
          fi

  web:
    name: Web — lint, typecheck, build
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Générer le client API depuis le contrat OpenAPI
        run: npm run generate:client
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build --workspace=web

  e2e:
    name: E2E — Playwright sur la stack Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image API
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          tags: lebontroc-api:ci
          load: true
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - name: Build image Web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          tags: lebontroc-web:ci
          load: true
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
      - name: Démarrer la stack
        run: docker compose -f docker-compose.ci.yml up -d --wait
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Installer Chromium Playwright
        run: npx playwright install --with-deps chromium
        working-directory: e2e
      - name: Tests E2E
        run: npm run e2e
        env:
          E2E_BASE_URL: http://localhost:3000
      - name: Logs de la stack (en cas d'échec)
        if: failure()
        # Émis en annotation ::error:: — lisible via l'API publique des checks,
        # contrairement aux logs bruts du job.
        run: |
          docker compose -f docker-compose.ci.yml logs
          LOGS=$(docker compose -f docker-compose.ci.yml ps -a 2>&1; echo; docker compose -f docker-compose.ci.yml logs --tail 40 2>&1)
          LOGS="${LOGS//'%'/'%25'}"
          LOGS="${LOGS//$'\n'/'%0A'}"
          echo "::error title=stack-e2e::${LOGS}"
      - name: Rapport Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/

  publish:
    name: Publier les images sur GHCR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [api, web, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: SHA court
        id: sha
        run: echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
      - name: Push image API
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/lebontroc-api:latest
            ghcr.io/${{ github.repository_owner }}/lebontroc-api:sha-${{ steps.sha.outputs.short }}
          build-args: |
            BUILD_SHA=${{ steps.sha.outputs.short }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - name: Push image Web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/lebontroc-web:latest
            ghcr.io/${{ github.repository_owner }}/lebontroc-web:sha-${{ steps.sha.outputs.short }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
