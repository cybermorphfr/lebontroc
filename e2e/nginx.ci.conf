# Reproduit le routage Traefik de prod pour les tests E2E :
# /api/* → api (préfixe retiré), le reste → web.
server {
    listen 80;

    location /api/ {
        proxy_pass http://api:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location / {
        proxy_pass http://web:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
