# Stack éphémère pour les tests E2E en CI : les images viennent d'être
# construites localement (tags *:ci). Un nginx reproduit le routage Traefik
# (front sur /, API sous /api) ; Playwright frappe http://localhost:3000.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lebontroc
      POSTGRES_PASSWORD: lebontroc
      POSTGRES_DB: lebontroc
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lebontroc"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      # API HTTP de Mailpit, utilisée par les tests pour lire les e-mails.
      - "8025:8025"

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data
    environment:
      MINIO_ROOT_USER: lebontroc
      MINIO_ROOT_PASSWORD: lebontroc-ci-secret
    ports:
      # Le navigateur Playwright (hôte) PUT directement sur localhost:9000 —
      # pas de route nginx : le strip de préfixe casserait la signature SigV4.
      - "9000:9000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    image: lebontroc-api:ci
    environment:
      DATABASE_URL: postgres://lebontroc:lebontroc@db:5432/lebontroc
      RUST_LOG: info
      JWT_SECRET: secret-de-ci-secret-de-ci-secret-de-ci
      COOKIE_SECURE: "false"
      APP_BASE_URL: http://localhost:3000
      ANALYTICS_SALT: sel-de-ci
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      S3_BUCKET: lebontroc-photos
      S3_ACCESS_KEY: lebontroc
      S3_SECRET_KEY: lebontroc-ci-secret
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
      minio:
        condition: service_healthy

  web:
    image: lebontroc-web:ci
    environment:
      API_INTERNAL_URL: http://api:8080
    depends_on:
      api:
        condition: service_healthy

  proxy:
    image: nginx:alpine
    ports:
      - "3000:80"
    volumes:
      - ./e2e/nginx.ci.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web:
        condition: service_healthy
