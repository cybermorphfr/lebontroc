# Stack éphémère pour les tests E2E en CI : les images viennent d'être
# construites localement (tags *:ci), Playwright frappe http://localhost:3000.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lebontroc
      POSTGRES_PASSWORD: lebontroc
      POSTGRES_DB: lebontroc
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lebontroc"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    image: lebontroc-api:ci
    environment:
      DATABASE_URL: postgres://lebontroc:lebontroc@db:5432/lebontroc
      RUST_LOG: info
    depends_on:
      db:
        condition: service_healthy

  web:
    image: lebontroc-web:ci
    environment:
      API_INTERNAL_URL: http://api:8080
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
